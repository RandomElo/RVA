add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header X-Frame-Options "DENY" always;

# CSP tolérante pour Vite HMR + Google + Turnstile en local
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; frame-src 'self' https://accounts.google.com https://challenges.cloudflare.com; connect-src 'self' ws://localhost:* http://localhost:* https://accounts.google.com https://challenges.cloudflare.com; img-src 'self' data: https:; base-uri 'self';" always;