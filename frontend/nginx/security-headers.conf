add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://challenges.cloudflare.com https://*.canva.com https://static.canva.com https://sdk.canva.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; frame-src 'self' https://accounts.google.com https://challenges.cloudflare.com https://www.canva.com https://*.canva.com; connect-src 'self' https://accounts.google.com https://challenges.cloudflare.com https://*.canva.com; img-src 'self' data: https: blob:; object-src 'none'; base-uri 'self';" always;