# 1. Redirection du port 80 vers HTTPS + Challenge Let's Encrypt
server {
    listen 80;
    server_name rva.smce.ovh www.rva.smce.ovh;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Serveur principal en HTTPS (Port 443)
server {
    listen 443 ssl;
    server_name rva.smce.ovh www.rva.smce.ovh;

    ssl_certificate /etc/letsencrypt/live/rva.smce.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rva.smce.ovh/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    include security-headers.conf;

    access_log /dev/stdout json_analytics;
    error_log /dev/stderr warn;

    client_max_body_size 20M;
    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header X-Request-ID $http_x_request_id;

    location ^~ /img/favicon/ {
        include security-headers.conf;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    location ^~ /img/banniere/ {
        include security-headers.conf;
        etag on;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /img/thomas/ {
        include security-headers.conf;
        etag on;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /img/ {
        include security-headers.conf;
        alias /usr/share/nginx/html/img/;
        expires 6m;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ =404;
    }

    location /textes/ {
        include security-headers.conf;
        alias /usr/share/nginx/html/textes/;
        expires 1d;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ =404;
    }

    # Proxy Express
    location ~* ^/(utilisateurs|autres|articles|courses|statistiques|specialistes|fichiers|images|pages|helloasso) {
        proxy_pass http://backend:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Assets JS/CSS/Images/Fonts avec mise en cache
    location ~* \.(?:css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        include security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        include security-headers.conf;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }

    # SPA React
    location = /index.html {
        include security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}